<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Loot</title>
    styles.css
</head>
<body>

<header class="header">
    <h1>💖 Cute Loot 💖</h1>

</section>

<section>
    <h2>Featured Plushies</h2>

    <div class="card">
        <h3>Arctic Fox Plush</h3>
        <p>$24.99</p>
        <button>Add To Cart</button>
    </div>

    <div class="card">
        <h3>Vintage TY Bear</h3>
        <p>$19.99</p>
        <button>Add To Cart</button>
    </div>
</section>

<section>
    <h2>Live Auctions</h2>

    <div class="card">
        <h3>Rare Wolf Plush</h3>
        <p>Current Bid: $42</p>
        <button>Place Bid</button>
    </div>
</section>

</html>
